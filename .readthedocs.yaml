# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
# The site documents the frost CLI. Nothing is compiled: there is no API
# reference, so the build needs only the Python packages below.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
